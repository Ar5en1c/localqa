<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LocalQA: Agent for your agents</title>
  <desc id="desc">LocalQA is a Bonsai-backed local sidecar for frontier coding agents, with MCP and OpenCode plugin modes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="0.55" stop-color="#eef7ee"/>
      <stop offset="1" stop-color="#e9f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#142015" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#344036"/>
    </marker>
    <style>
      .title { font: 800 68px Georgia, 'Times New Roman', serif; fill: #142015; }
      .subtitle { font: 600 29px Georgia, 'Times New Roman', serif; fill: #29352d; }
      .eyebrow { font: 800 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6a5422; letter-spacing: 2px; }
      .h2 { font: 800 32px Georgia, 'Times New Roman', serif; fill: #142015; }
      .body { font: 650 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #263129; }
      .small { font: 560 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #425047; }
      .mono { font: 800 22px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #17321e; }
      .tiny { font: 560 15px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #4a554d; }
      .card { fill: rgba(255,255,255,0.82); stroke: rgba(20,32,21,0.13); stroke-width: 1.6; }
      .line { stroke: #344036; stroke-width: 4; fill: none; marker-end: url(#arrow); opacity: 0.72; }
      .blueLine { stroke: #466899; stroke-width: 4; fill: none; marker-end: url(#arrow); opacity: 0.80; stroke-dasharray: 10 9; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1420" cy="105" r="210" fill="#dfb85c" opacity="0.18"/>
  <circle cx="180" cy="780" r="260" fill="#6f9d6f" opacity="0.16"/>

  <text class="eyebrow" x="80" y="78">LOCALQA V0.1 ALPHA</text>
  <text class="title" x="80" y="154">Agent for your agents.</text>
  <text class="subtitle" x="82" y="204">A Bonsai-backed local sidecar for frontier coding agents.</text>
  <text class="subtitle" x="82" y="242">Keeps noisy evidence local. Returns compact verified context.</text>

  <rect class="card" x="80" y="330" width="390" height="235" rx="26" filter="url(#shadow)"/>
  <text class="h2" x="115" y="378">Frontier model</text>
  <text class="body" x="115" y="424">Plans, reasons,</text>
  <text class="body" x="115" y="454">and writes code.</text>
  <text class="small" x="115" y="500">GPT / Claude / Codex / OpenCode</text>
  <rect x="115" y="522" width="210" height="38" rx="19" fill="#dfead8"/>
  <text class="mono" x="137" y="548">planner</text>

  <rect class="card" x="605" y="300" width="390" height="295" rx="26" filter="url(#shadow)"/>
  <text class="h2" x="640" y="348">LocalQA sidecar</text>
  <text class="body" x="640" y="394">Collects, compresses,</text>
  <text class="body" x="640" y="424">remembers, verifies.</text>
  <text class="small" x="640" y="470">logs / browser / repo / docs</text>
  <text class="small" x="640" y="498">memory / handoff cleanup</text>
  <rect x="640" y="522" width="245" height="42" rx="21" fill="#d8e8ff"/>
  <text class="mono" x="662" y="550">local_agent_run</text>
  <text class="small" x="640" y="582">Bonsai handles evidence triage.</text>

  <rect class="card" x="1130" y="330" width="390" height="235" rx="26" filter="url(#shadow)"/>
  <text class="h2" x="1165" y="378">Compact report</text>
  <text class="body" x="1165" y="424">Verified findings,</text>
  <text class="body" x="1165" y="454">risks, next reads.</text>
  <text class="small" x="1165" y="500">The main model sees less noise.</text>
  <rect x="1165" y="522" width="210" height="38" rx="19" fill="#f1dfb6"/>
  <text class="mono" x="1188" y="548">less context</text>

  <path class="line" d="M472 448 C515 448 560 448 602 448"/>
  <path class="line" d="M998 448 C1045 448 1085 448 1127 448"/>
  <path class="blueLine" d="M800 598 C800 630 800 650 800 675"/>

  <rect class="card" x="80" y="675" width="690" height="145" rx="24"/>
  <text class="h2" x="115" y="720">MCP mode</text>
  <text class="body" x="115" y="760">Portable default. One strict tool:</text>
  <text class="mono" x="470" y="760">local_agent_run</text>
  <text class="small" x="115" y="796">Best for MCP-compatible coding agents.</text>

  <rect class="card" x="830" y="675" width="690" height="145" rx="24"/>
  <text class="h2" x="865" y="720">OpenCode plugin mode</text>
  <text class="body" x="865" y="760">Deeper workflow: tools, rules, hooks, vault handles.</text>
  <text class="small" x="865" y="796">Best for OpenCode users who want stronger local workflows.</text>

  <text class="tiny" x="80" y="866">Boundary: does not replace frontier models, intercept pasted cloud prompts, or prove final patch correctness.</text>
</svg>
