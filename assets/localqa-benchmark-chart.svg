<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">LocalQA benchmark chart</title>
  <desc id="desc">Benchmark chart showing token reductions for LocalQA launch checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c15"/>
      <stop offset="1" stop-color="#263b46"/>
    </linearGradient>
    <style>
      .title { font: 800 52px Georgia, 'Times New Roman', serif; fill: #fbf3de; }
      .sub { font: 500 23px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #dfe9dd; }
      .label { font: 700 22px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fbf3de; }
      .small { font: 500 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c8d5ca; }
      .num { font: 800 28px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fbf3de; }
      .axis { stroke: rgba(251,243,222,0.2); stroke-width: 2; }
      .raw { fill: #d96b43; }
      .compact { fill: #70b77e; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.12); stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <circle cx="1190" cy="110" r="210" fill="#70b77e" opacity="0.08"/>
  <circle cx="180" cy="650" r="220" fill="#d96b43" opacity="0.08"/>

  <text class="title" x="70" y="86">LocalQA launch proof</text>
  <text class="sub" x="72" y="126">Token reductions from reproducible alpha benchmarks. Frontier model still plans and writes code.</text>

  <rect class="card" x="70" y="170" width="1260" height="470" rx="28"/>
  <line class="axis" x1="300" y1="575" x2="1250" y2="575"/>

  <text class="label" x="110" y="250">Provider telemetry A/B</text>
  <text class="small" x="110" y="282">Fresh input tokens</text>
  <rect class="raw" x="300" y="222" width="360" height="34" rx="17"/>
  <rect class="compact" x="300" y="264" width="168" height="34" rx="17"/>
  <text class="num" x="690" y="250">25,850 -> 12,048</text>
  <text class="num" x="1040" y="250">53.39%</text>

  <text class="label" x="110" y="380">A/B workflow proxy</text>
  <text class="small" x="110" y="412">3/3 quality gates</text>
  <rect class="raw" x="300" y="352" width="360" height="34" rx="17"/>
  <rect class="compact" x="300" y="394" width="93" height="34" rx="17"/>
  <text class="num" x="690" y="380">25,829 -> 6,704</text>
  <text class="num" x="1040" y="380">74.04%</text>

  <text class="label" x="110" y="510">Long-horizon 300k</text>
  <text class="small" x="110" y="542">9/9 quality gates, 9/9 memory writes</text>
  <rect class="raw" x="300" y="482" width="760" height="34" rx="17"/>
  <rect class="compact" x="300" y="524" width="23" height="34" rx="12"/>
  <text class="num" x="1085" y="510">302,772 -> 8,842</text>
  <text class="num" x="1085" y="548">97.08%</text>

  <rect class="raw" x="825" y="670" width="28" height="28" rx="7"/>
  <text class="small" x="865" y="692">baseline/raw evidence tokens</text>
  <rect class="compact" x="1090" y="670" width="28" height="28" rx="7"/>
  <text class="small" x="1130" y="692">LocalQA compact tokens</text>
  <text class="small" x="70" y="692">Caveat: compression benchmarks are not patch-correctness benchmarks and do not intercept pasted cloud prompts.</text>
</svg>
