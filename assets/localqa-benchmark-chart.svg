<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LocalQA benchmark chart</title>
  <desc id="desc">Launch benchmark chart showing LocalQA token reductions across provider telemetry, A/B workflows, and long-horizon benchmarks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b14"/>
      <stop offset="1" stop-color="#263b46"/>
    </linearGradient>
    <style>
      .title { font: 800 60px Georgia, 'Times New Roman', serif; fill: #fbf3de; }
      .sub { font: 550 24px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #dfe9dd; }
      .label { font: 800 25px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #fbf3de; }
      .small { font: 550 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #c8d5ca; }
      .num { font: 800 29px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #fbf3de; }
      .pct { font: 900 38px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f5d27e; }
      .axis { stroke: rgba(251,243,222,0.2); stroke-width: 2; }
      .raw { fill: #d96b43; }
      .compact { fill: #70b77e; }
      .card { fill: rgba(255,255,255,0.065); stroke: rgba(255,255,255,0.14); stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1370" cy="130" r="230" fill="#70b77e" opacity="0.09"/>
  <circle cx="160" cy="780" r="240" fill="#d96b43" opacity="0.08"/>

  <text class="title" x="80" y="94">LocalQA launch proof</text>
  <text class="sub" x="82" y="135">Agent for your agents: less noisy evidence in frontier model context.</text>

  <rect class="card" x="70" y="185" width="1460" height="560" rx="30"/>
  <line class="axis" x1="360" y1="675" x2="1360" y2="675"/>

  <text class="label" x="115" y="270">Provider telemetry A/B</text>
  <text class="small" x="115" y="302">Fresh input tokens</text>
  <rect class="raw" x="430" y="238" width="390" height="38" rx="19"/>
  <rect class="compact" x="430" y="288" width="182" height="38" rx="19"/>
  <text class="num" x="860" y="268">25,850 -> 12,048</text>
  <text class="pct" x="1240" y="270">53.39%</text>

  <text class="label" x="115" y="430">A/B workflow proxy</text>
  <text class="small" x="115" y="462">3/3 quality gates maintained</text>
  <rect class="raw" x="430" y="398" width="390" height="38" rx="19"/>
  <rect class="compact" x="430" y="448" width="101" height="38" rx="19"/>
  <text class="num" x="860" y="428">25,829 -> 6,704</text>
  <text class="pct" x="1240" y="430">74.04%</text>

  <text class="label" x="115" y="590">Long-horizon 300k</text>
  <text class="small" x="115" y="622">9/9 quality gates, 9/9 memory writes</text>
  <rect class="raw" x="430" y="558" width="790" height="38" rx="19"/>
  <rect class="compact" x="430" y="608" width="24" height="38" rx="12"/>
  <text class="num" x="1240" y="588">302,772 -></text>
  <text class="num" x="1240" y="626">8,842</text>
  <text class="pct" x="1240" y="665">97.08%</text>

  <rect class="raw" x="880" y="790" width="30" height="30" rx="7"/>
  <text class="small" x="924" y="812">baseline/raw evidence tokens</text>
  <rect class="compact" x="1200" y="790" width="30" height="30" rx="7"/>
  <text class="small" x="1244" y="812">LocalQA compact tokens</text>
  <text class="small" x="80" y="812">Caveat: compression benchmarks are not patch-correctness benchmarks.</text>
  <text class="small" x="80" y="844">LocalQA does not intercept text pasted directly into cloud chat.</text>
</svg>
